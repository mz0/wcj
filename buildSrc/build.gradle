plugins {
    id 'java-gradle-plugin'
}

repositories {
    mavenCentral()
}

gradlePlugin {
    plugins {
        register("semver-plugin") {
            id = "semver"
            implementationClass = "com.exactpro.build.SemVerPlugin"
        }
    }
}

dependencies {
    implementation("org.eclipse.jgit:org.eclipse.jgit:[6.0,7.0[")
}
