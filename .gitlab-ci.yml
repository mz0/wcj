image: ${SHSHA_DOCKER_REGISTRY}/jdk-plus-db-cli-utils:11.0.23-mysql8.4.0-pg16.3
stages:
  - build
  - build-and-test
cache:
  key: global
  paths:
    - .gradle/wrapper
    - .gradle/caches
before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle

build:
  stage: build
  tags:
    - docker
  script:
    - ./gradlew build
  artifacts:
    paths:
      - "app/build/distributions/"
    expire_in: 1 week
    reports:
      junit:
        - "**/build/test-results/test/TEST-*.xml"
  only:
    - main
    - /^feature\/.+$/

build-and-test:
  stage: build-and-test
  tags:
    - docker
  script:
    - ./gradlew --warning-mode=all build
  artifacts:
    when: always
    reports:
      junit:
        - "build/test-results/functionalTest/TEST-*.xml"
        - "**/build/test-results/test/TEST-*.xml"
    expire_in: 1 day
  only:
    - merge_requests
